name: Android F-Droid CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew testFdroidDebugUnitTest --stacktrace
      - name: Run lint
        run: ./gradlew lintFdroidDebug --stacktrace
      - name: Assemble F-Droid debug APK
        run: ./gradlew assembleFdroidDebug --stacktrace
      - name: Assemble F-Droid release APK
        run: ./gradlew assembleFdroidRelease --stacktrace
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aionos-fdroid-build
          path: |
            android/app/build/outputs/apk/fdroid/debug/*.apk
            android/app/build/reports/**
          if-no-files-found: warn

  instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            cd android && ./gradlew connectedFdroidDebugAndroidTest --stacktrace
